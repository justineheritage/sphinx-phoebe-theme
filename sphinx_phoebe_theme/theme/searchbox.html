{# Sphinx Phoebe Theme — Search Box #}
<div class="cl-search" role="search" aria-label="Search documentation">
  <form class="cl-search-form" action="{{ pathto('search') }}" method="GET">
    <svg class="cl-search-icon" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" class="cl-search-input" name="q"
           placeholder="Search docs…"
           autocapitalize="off" autocomplete="off" spellcheck="false"
           aria-label="Search documentation">
    <kbd class="cl-search-shortcut">/</kbd>
  </form>
</div>
